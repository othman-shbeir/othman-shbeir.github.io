<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN" "http://www.w3.org/TR/REC-html40/loose.dtd"> <html><body> <h3 id="gallery">Screenshots</h3> <div class="screenshot-grid"> </div> <style>.screenshot-grid{display:grid;gap:12px;grid-template-columns:repeat(12,1fr)}@media(max-width:1200px){.screenshot-grid{grid-template-columns:repeat(8,1fr)}}@media(max-width:768px){.screenshot-grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:520px){.screenshot-grid{grid-template-columns:repeat(2,1fr)}}.screenshot-grid .shot{position:relative;display:block;overflow:hidden;border-radius:14px;box-shadow:0 10px 24px rgba(0,0,0,.12);transition:transform .2s ease,box-shadow .2s ease}.screenshot-grid .shot:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(0,0,0,.18)}.screenshot-grid img{width:100%;height:100%;display:block;aspect-ratio:16 / 9;object-fit:cover;transition:transform .35s ease}.screenshot-grid .shot:hover img{transform:scale(1.03)}.screenshot-grid .caption{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;font-size:.9rem;line-height:1.2;color:#fff;background:linear-gradient(to top,rgba(0,0,0,.6),rgba(0,0,0,0));text-shadow:0 1px 2px rgba(0,0,0,.5)}</style> </body></html>
